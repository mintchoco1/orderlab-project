name: Python CI.  # 워크플로 이름. 깃허브 저장소의 Action 탭에서 표시되는 이름
on: [push, pull_request] # 언제 실행할지
permissions: 
    contents: read    # 이 워크플로가 저장소에 대해 가지는 권한. 최소 권한 원칙
jobs: # 실행할 작업 목록
    quality:   # 할일의 이름
        runs-on: ubuntu-latest
        steps:  # job에서 위에서부터 순서대로 실행할 단계. 중간에 하나라도 실패하면 그 아래 단계는 실행X
            - uses: actions/checkout@v7  # uses는 남이 만들어 둔 기성 기능을 가져다 씀. 라이브러리 함수 호출하는 것
            - uses: actions/setup-python@v7 
              with:
                python-version: "3.14"
            - run: python -m pip install -r requirements.txt  # run 터미널 명령어를 직접 실행
            - run: ruff check .
            - run: ruff format --check .
            - run: python -m pytest -q
